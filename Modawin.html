  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#FAF6F0;--bg2:#F0EAE0;--bg3:#E8E0D4;--text:#2D2A26;--text2:#6B6560;--text3:#9B9590;--accent:#B8860B;--accent2:#DAA520;--accent-soft:rgba(184,134,11,0.1);--danger:#C0392B;--danger-soft:rgba(192,57,43,0.08);--radius:12px;--shadow:0 2px 12px rgba(45,42,38,0.06);--card:#FFFFFF}
  [data-theme="dark"]{--bg:#1A1816;--bg2:#2A2724;--bg3:#3A3632;--text:#E8E0D4;--text2:#A09890;--text3:#706860;--accent:#DAA520;--accent2:#F0C040;--accent-soft:rgba(218,165,32,0.15);--danger:#E74C3C;--danger-soft:rgba(231,76,60,0.15);--shadow:0 2px 12px rgba(0,0,0,0.2);--card:#242120}
  body{background:var(--bg);font-family:'Journali','Segoe UI',Tahoma,sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;transition:background .3s,color .3s;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .container{max-width:700px;margin:0 auto;padding:20px 16px 60px}
  .header{text-align:center;margin-bottom:28px;position:relative}
  .header h1{font-size:32px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;margin-bottom:4px}
  .header p{font-size:13px;color:var(--text3);font-weight:300}
  .theme-toggle{position:absolute;top:4px;left:4px;background:var(--bg2);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text2)}
  .theme-toggle:hover{background:var(--bg3);color:var(--accent)}
  .reset-btn-header{position:absolute;top:4px;right:4px;background:var(--bg2);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text3)}
  .reset-btn-header:hover{background:var(--danger-soft);color:var(--danger)}
  .tabs{display:flex;gap:0;margin-bottom:24px;border-radius:10px;background:var(--bg2);padding:3px}
  .tab-btn{flex:1;padding:10px 0;border:none;border-radius:8px;background:transparent;color:var(--text2);font-family:inherit;font-size:15px;font-weight:400;cursor:pointer;transition:all .2s}
  .tab-btn.active{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;padding:0 4px}
  .nav-btn{background:var(--bg2);border:none;border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;color:var(--text);font-weight:700;font-family:monospace;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .nav-btn:hover{background:var(--bg3)}
  .date-center{text-align:center;flex:1;position:relative}
  .date-center .date-display{color:var(--text)}
  .date-key{font-size:13px;color:var(--text3);font-family:monospace;letter-spacing:1px;margin-bottom:2px}
  .date-display{font-size:18px;font-weight:700}
  .today-badge{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-soft);padding:2px 10px;border-radius:20px}
  .quick-jump{display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:8px;flex-wrap:wrap}

// ===== PWA: Generate icons + manifest + service worker =====
(function(){

function cleanupTags(){
  // Scan all entries to find which tags are actually in use
  const usedTags=new Set();const keys=storeKeys("day:");
  keys.forEach(k=>{const data=storeGet(k);if(!data)return;data.forEach(e=>{getTags(e).forEach(t=>usedTags.add(t))})});
  // Remove unused tags from allTags
  const before=allTags.length;
  allTags=allTags.filter(t=>usedTags.has(t));
  // Remove unused from archivedTags
  archivedTags=archivedTags.filter(t=>usedTags.has(t));
  // Remove unused from folders
  folders.forEach(f=>{f.tags=f.tags.filter(t=>usedTags.has(t))});
  // Remove empty archived folders
  folders=folders.filter(f=>!f.archived||f.tags.length>0);
  // Clean hidden suggestions for tags that no longer exist
  hiddenSuggestions=hiddenSuggestions.filter(t=>usedTags.has(t));
  if(allTags.length!==before){saveTags();saveArchived();saveFolders();saveHidden()}
}

function setupEditTagCombo(){
  const input=document.getElementById("editTagInput"),dd=document.getElementById("editTagDD");if(!input||!dd)return;
  let hl=-1;
  function show(f){
    const q=f.trim().toLowerCase();const pool=activeTags().filter(t=>!editTags.includes(t)&&!hiddenSuggestions.includes(t));

      else if(!editTags.includes(v)){editTags.push(v)}

  const stats=getTagStats();const q=projSearch.trim().toLowerCase();const isArch=showArchive;
  const pool=isArch?archivedTags.filter(t=>!q||fuzzy(t.toLowerCase(),q)):activeTags().filter(t=>!q||fuzzy(t.toLowerCase(),q));

  let h='<div class="proj-toolbar"><input class="proj-search" id="projSearchInput" placeholder="ابحث في الأوسمة..." value="'+esc(projSearch)+'">';
  h+='<button class="proj-icon-btn'+(showArchive?' active':'')+'" onclick="toggleArchiveView()" title="الأرشيف">📦</button>';
  if(!isArch)h+='<button class="proj-icon-btn" onclick="toggleNewFolder()" title="مجلد جديد">📁+</button>';
  h+='</div>';
  if(showNewFolder&&!isArch)h+='<div class="new-folder-row"><input class="new-folder-input" id="newFolderInput" placeholder="اسم المجلد الجديد..."><button class="sm-btn" onclick="createFolder()">إنشاء</button></div>';

  if(isArch){
    const archFolders=folders.filter(f=>f.archived);
    const tagsInArchFolders=new Set();archFolders.forEach(f=>f.tags.forEach(t=>tagsInArchFolders.add(t)));
    const looseTags=pool.filter(t=>!tagsInArchFolders.has(t));
    h+='<div style="padding:0 4px 12px;font-size:14px;font-weight:700;color:var(--text2)">📦 الأرشيف</div>';
    archFolders.forEach(f=>{
      const fTags=f.tags.filter(t=>archivedTags.includes(t)&&(!q||fuzzy(t.toLowerCase(),q)));
      if(q&&fTags.length===0&&!fuzzy(f.name.toLowerCase(),q))return;
      const isOpen=openFolders[f.id]!==false;
      h+='<div class="folder"><div class="folder-header" onclick="toggleFolder(\''+f.id+'\')"><span class="folder-chevron'+(isOpen?' open':'')+'">◀</span><span class="folder-name">📦 '+esc(f.name)+'</span><span class="folder-count">'+fTags.length+'</span><div class="folder-actions" onclick="event.stopPropagation()"><button class="folder-act" onclick="unarchiveFolder(\''+f.id+'\')" title="إلغاء أرشفة المجلد">📤</button></div></div>';
      if(isOpen){h+='<div class="folder-body">';fTags.forEach(tag=>{h+=renderTagBar(tag,stats[tag]||{count:0,days:new Set()},true,f.id)});h+='</div>'}h+='</div>';
    });
    if(looseTags.length>0){if(archFolders.length>0)h+='<div style="padding:8px 4px 6px;font-size:13px;color:var(--text3);font-weight:500">أوسمة مؤرشفة بدون مجلد</div>';looseTags.forEach(tag=>{h+=renderTagBar(tag,stats[tag]||{count:0,days:new Set()},true)})}
    if(archFolders.length===0&&looseTags.length===0)h+='<p class="empty-msg">الأرشيف فارغ</p>';
  }else{
    folders.forEach(f=>{if(f.archived)return;const fTags=f.tags.filter(t=>!archivedTags.includes(t)&&(!q||fuzzy(t.toLowerCase(),q)));if(q&&fTags.length===0)return;const isOpen=openFolders[f.id]!==false;
      h+='<div class="folder"><div class="folder-header" onclick="toggleFolder(\''+f.id+'\')"><span class="folder-chevron'+(isOpen?' open':'')+'">◀</span><span class="folder-name">'+esc(f.name)+'</span><span class="folder-count">'+fTags.length+'</span><div class="folder-actions" onclick="event.stopPropagation()"><button class="folder-act" onclick="renameFolder(\''+f.id+'\')" title="إعادة تسمية">✎</button><button class="folder-act" onclick="archiveFolder(\''+f.id+'\')" title="أرشفة المجلد">📦</button><button class="folder-act" onclick="deleteFolder(\''+f.id+'\')" title="حذف المجلد">✕</button></div></div>';
      if(isOpen){h+='<div class="folder-body">';fTags.forEach(tag=>{h+=renderTagBar(tag,stats[tag]||{count:0,days:new Set()},false,f.id)});h+='</div>'}h+='</div>'});
    const unfiled=pool.filter(t=>!tagInFolder(t));
    if(unfiled.length>0){if(folders.filter(f=>!f.archived).length>0)h+='<div style="padding:8px 4px 6px;font-size:13px;color:var(--text3);font-weight:500">بدون مجلد</div>';unfiled.forEach(tag=>{h+=renderTagBar(tag,stats[tag]||{count:0,days:new Set()},false)})}
    if(pool.length===0&&folders.filter(f=>!f.archived).length===0)h+='<p class="empty-msg">لا توجد أوسمة بعد.<br>أضف وسمًا لملاحظاتك لرؤية المشاريع هنا.</p>';
  }
  c.innerHTML=h;
  const si=document.getElementById("projSearchInput");if(si){si.addEventListener("input",function(){projSearch=this.value;renderProjectsList()});si.focus();si.setSelectionRange(si.value.length,si.value.length)}
  const nfi=document.getElementById("newFolderInput");if(nfi){nfi.focus();nfi.addEventListener("keydown",function(e){if(e.key==="Enter")createFolder()})}
}

function renderTagBar(tag,s,isArchived,folderId){
  const cnt=s.count||0,dayC=s.days?s.days.size:0;let range="";
  if(s.first&&s.last&&s.first!==s.last){const fd=parseKey(s.first),ld=parseKey(s.last);range=fd.getDate()+" "+MONTHS_AR[fd.getMonth()]+" → "+ld.getDate()+" "+MONTHS_AR[ld.getMonth()]+" "+ld.getFullYear()}
  else if(s.first){const fd=parseKey(s.first);range=fd.getDate()+" "+MONTHS_AR[fd.getMonth()]+" "+fd.getFullYear()}
  let h='<div class="tag-bar" onclick="openProject(\''+esc(tag).replace(/'/g,"&#39;")+'\')">';
  h+='<div class="tag-bar-name">#'+esc(tag)+'</div><div class="tag-bar-info">';
  if(range)h+='<span class="tag-bar-stat">'+range+'</span>';
  h+='<span class="tag-bar-stat">'+cnt+' ملاحظة</span><span class="tag-bar-stat">'+dayC+' يوم</span></div>';
  h+='<div class="tag-bar-actions" onclick="event.stopPropagation()">';
  if(isArchived){h+='<button class="tb-act" onclick="unarchiveTag(\''+esc(tag).replace(/'/g,"&#39;")+'\')" title="إلغاء الأرشفة">📤</button>'}
  else{if(folders.filter(f=>!f.archived).length>0)h+='<button class="tb-act" onclick="showMoveMenu(event,\''+esc(tag).replace(/'/g,"&#39;")+'\',\''+(folderId||"")+'\')" title="نقل لمجلد">📁</button>';
    h+='<button class="tb-act" onclick="archiveTag(\''+esc(tag).replace(/'/g,"&#39;")+'\')" title="أرشفة">📦</button>'}
  h+='</div></div>';return h}

function toggleArchiveView(){showArchive=!showArchive;renderProjectsList()}
function toggleNewFolder(){showNewFolder=!showNewFolder;renderProjectsList()}
function toggleFolder(id){openFolders[id]=openFolders[id]===false?true:!(openFolders[id]!==false);renderProjectsList()}
function createFolder(){const inp=document.getElementById("newFolderInput");if(!inp)return;const name=inp.value.trim();if(!name)return;folders.push({id:uid(),name,tags:[],archived:false});saveFolders();showNewFolder=false;renderProjectsList();showToast("تم إنشاء المجلد")}
function renameFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;document.getElementById("modalContainer").innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 style="color:var(--accent)">إعادة تسمية المجلد</h3><input class="modal-input" id="renameFolderInput" value="'+esc(f.name)+'"><div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">إلغاء</button><button class="modal-ok" onclick="doRenameFolder(\''+id+'\')">حفظ</button></div></div></div>';setTimeout(()=>{const i=document.getElementById("renameFolderInput");if(i){i.focus();i.select()}},100)}
function doRenameFolder(id){const inp=document.getElementById("renameFolderInput");if(!inp)return;const n=inp.value.trim();if(!n)return;const f=folders.find(x=>x.id===id);if(f){f.name=n;saveFolders()}closeModal();renderProjectsList();showToast("تم التعديل")}
function deleteFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;document.getElementById("modalContainer").innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>حذف المجلد</h3><p>سيتم حذف المجلد "'+esc(f.name)+'" فقط. الأوسمة ستبقى بدون مجلد.</p><div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">إلغاء</button><button class="modal-danger" onclick="doDeleteFolder(\''+id+'\')">حذف</button></div></div></div>'}
function doDeleteFolder(id){folders=folders.filter(f=>f.id!==id);saveFolders();closeModal();renderProjectsList();showToast("تم حذف المجلد")}
function archiveFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;f.tags.forEach(t=>{if(!archivedTags.includes(t))archivedTags.push(t)});saveArchived();f.archived=true;saveFolders();renderProjectsList();showToast("تم أرشفة المجلد وأوسمته")}
function unarchiveFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;f.tags.forEach(t=>{archivedTags=archivedTags.filter(a=>a!==t)});saveArchived();f.archived=false;saveFolders();renderProjectsList();showToast("تم إلغاء أرشفة المجلد وأوسمته")}
function archiveTag(tag){if(!archivedTags.includes(tag))archivedTags.push(tag);saveArchived();renderProjectsList();showToast("تم الأرشفة")}
function unarchiveTag(tag){archivedTags=archivedTags.filter(t=>t!==tag);saveArchived();folders.forEach(f=>{if(f.archived&&f.tags.includes(tag)){f.tags=f.tags.filter(t=>t!==tag)}});saveFolders();renderProjectsList();showToast("تم إلغاء الأرشفة")}

function showMoveMenu(event,tag,currentFolderId){event.stopPropagation();const dd=document.getElementById("moveDropdown");const r=event.target.getBoundingClientRect();dd.style.top=r.bottom+4+"px";dd.style.left=r.left+"px";dd.style.right="auto";
  let h="";if(currentFolderId)h+='<div class="move-option" onclick="moveTag(\''+esc(tag).replace(/'/g,"&#39;")+'\',\'\')">بدون مجلد</div>';
  folders.filter(f=>!f.archived).forEach(f=>{if(f.id!==currentFolderId)h+='<div class="move-option" onclick="moveTag(\''+esc(tag).replace(/'/g,"&#39;")+'\',\''+f.id+'\')">'+esc(f.name)+'</div>'});
  if(!h){dd.classList.add("hidden");return}dd.innerHTML=h;dd.classList.remove("hidden");
  function close(e){if(!dd.contains(e.target)){dd.classList.add("hidden");document.removeEventListener("click",close)}}setTimeout(()=>document.addEventListener("click",close),0)}
function moveTag(tag,toFolderId){folders.forEach(f=>{f.tags=f.tags.filter(t=>t!==tag)});if(toFolderId){const f=folders.find(x=>x.id===toFolderId);if(f)f.tags.push(tag)}saveFolders();document.getElementById("moveDropdown").classList.add("hidden");renderProjectsList();showToast("تم النقل")}

function openProject(tag){
  document.getElementById("projectsList").innerHTML="";const det=document.getElementById("projectDetail");det.classList.remove("hidden");
  window._projT=tag;window._projFrom="";window._projTo="";
  renderProjectDetail(tag,"","");
}
function renderProjectDetail(tag,fromKey,toKey){
  const det=document.getElementById("projectDetail");
  const keys=storeKeys("day:"),results=[];
  keys.forEach(k=>{const dk=k.replace("day:","");if(fromKey&&dk<fromKey)return;if(toKey&&dk>toKey)return;const data=storeGet(k);if(!data)return;const fl=data.filter(e=>getTags(e).includes(tag));if(fl.length>0)results.push({dateKey:dk,entries:fl})});
  results.sort((a,b)=>a.dateKey.localeCompare(b.dateKey));const total=results.reduce((s,g)=>s+g.entries.length,0);
  window._projR=results;
  let h='<div class="proj-detail-header"><button class="proj-back" onclick="renderProjectsList()">← رجوع</button><div class="proj-detail-title">#'+esc(tag)+'</div><button class="accent-btn" style="padding:6px 16px;font-size:13px;flex:none" onclick="exportProject()">تصدير ↓</button></div>';
  // Date range filter
  h+='<div class="card" style="padding:14px 20px;margin-bottom:12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
  h+='<span style="font-size:13px;color:var(--text2)">من</span><input class="sm-input" type="date" id="projFilterFrom" dir="ltr" style="flex:1;min-width:120px" value="'+(window._projFrom||"")+'">';
  h+='<span style="font-size:13px;color:var(--text2)">إلى</span><input class="sm-input" type="date" id="projFilterTo" dir="ltr" style="flex:1;min-width:120px" value="'+(window._projTo||"")+'">';
  h+='<button class="accent-btn" style="flex:none;padding:8px 16px;font-size:13px" onclick="applyProjFilter()">عرض</button>';
  if(fromKey||toKey)h+='<button class="tool-btn" style="flex:none;padding:8px 12px;font-size:12px" onclick="clearProjFilter()">الكل</button>';
  h+='</div></div>';
  h+='<div style="padding:0 4px 12px;font-size:13px;color:var(--text2)">'+total+' ملاحظة في '+results.length+' يوم</div>';
  if(results.length===0)h+='<p class="empty-msg">لا توجد ملاحظات'+(fromKey||toKey?' في هذا النطاق':' لهذا الوسم')+'.</p>';
  else results.forEach(g=>{const d=parseKey(g.dateKey);h+='<div class="card result-group"><div class="result-date-row"><span class="result-date">'+fmtDateAr(d)+'</span><span class="result-key">'+g.dateKey+'</span></div>';
    g.entries.forEach(e=>{const tags=getTags(e).filter(t=>t!==tag);h+='<div class="result-entry"><span class="result-time">'+esc(e.time)+'</span><span class="result-text">'+escNl(e.text);
      if(tags.length>0){h+='<div class="result-tags">';tags.forEach(t=>{h+='<span class="entry-tag">#'+esc(t)+'</span>'});h+='</div>'}
      h+='</span></div>'});h+='</div>'});
  det.innerHTML=h;
}
function applyProjFilter(){
  const from=document.getElementById("projFilterFrom").value;const to=document.getElementById("projFilterTo").value;
  window._projFrom=from;window._projTo=to;
  renderProjectDetail(window._projT,from?from.replace(/-/g,""):"",to?to.replace(/-/g,""):"");
}
function clearProjFilter(){window._projFrom="";window._projTo="";renderProjectDetail(window._projT,"","")}

function exportProject(){const r=window._projR,tag=window._projT;if(!r||!r.length)return;let c="";r.forEach(g=>{c+=g.dateKey+"\n";g.entries.forEach(e=>{const l=e.text.split("\n");c+="* "+e.time+" / "+l[0];const tags=getTags(e);if(tags.length>0)tags.forEach(t=>{c+=" [#"+t+"]"});c+="\n";for(let i=1;i<l.length;i++)c+="  "+l[i]+"\n"});c+="\n"});
  let fn=tag;const from=window._projFrom,to=window._projTo;
  if(from||to)fn+="_"+(from?from.replace(/-/g,""):"start")+"-"+(to?to.replace(/-/g,""):"end");else fn+="_all";
  downloadFile(fn+".txt",c.trim());showToast("تم التصدير")}

// ===== EXPORT / IMPORT =====
function entriesToTxt(dk,entries){let t=dk+"\n";entries.forEach(e=>{const l=e.text.split("\n");t+="* "+e.time+" / "+l[0];const tags=getTags(e);if(tags.length>0)tags.forEach(tg=>{t+=" [#"+tg+"]"});t+="\n";for(let i=1;i<l.length;i++)t+="  "+l[i]+"\n"});return t}
function downloadFile(fn,c){const B="\uFEFF";const b=new Blob([B+c],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
function exportDay(){if(currentEntries.length===0){showToast("لا توجد ملاحظات");return}downloadFile(dkey(viewDate)+".txt",entriesToTxt(dkey(viewDate),currentEntries).trim());showToast("تم تنزيل يومية اليوم")}
function exportAll(){const keys=storeKeys("day:");let c="";keys.forEach(k=>{const dk=k.replace("day:",""),data=storeGet(k);if(data&&data.length>0)c+=entriesToTxt(dk,data)+"\n"});
  c+="\n--- المدوّن | إعدادات ---\n";
  if(archivedTags.length>0)c+="أوسمة مؤرشفة: "+archivedTags.join(" | ")+"\n";
  if(hiddenSuggestions.length>0)c+="أوسمة مخفية: "+hiddenSuggestions.join(" | ")+"\n";
  folders.forEach(f=>{c+="مجلد"+(f.archived?" [مؤرشف]":"")+": "+f.name+" > "+(f.tags.length>0?f.tags.join(" | "):"فارغ")+"\n"});
  if(c.trim()==="--- المدوّن | إعدادات ---"){showToast("لا توجد بيانات");return}
  downloadFile("journal_backup.txt",c.trim());showToast("تم تنزيل النسخة الاحتياطية")}

function parseTxtFile(text){const days={};let cd=null,ce=null;const meta={archived:[],hidden:[],folders:[]};let inMeta=false;
  text.split("\n").forEach(line=>{const tr=line.trim();
    if(tr==="--- المدوّن | إعدادات ---"||tr==="--- يومياتي | إعدادات ---"){inMeta=true;if(ce&&cd){days[cd].push(ce);ce=null}return}
    if(inMeta){if(tr.startsWith("أوسمة مؤرشفة:")){const v=tr.slice(tr.indexOf(":")+1).trim();if(v)meta.archived=v.split("|").map(s=>s.trim()).filter(Boolean)}
      else if(tr.startsWith("أوسمة مخفية:")){const v=tr.slice(tr.indexOf(":")+1).trim();if(v)meta.hidden=v.split("|").map(s=>s.trim()).filter(Boolean)}
      else if(tr.startsWith("مجلد")){const isArch=/\[مؤرشف\]/.test(tr);const afterColon=tr.slice(tr.indexOf(":")+1).trim();const parts=afterColon.split(">");const name=(parts[0]||"").trim();let tags=[];if(parts[1]&&parts[1].trim()!=="فارغ")tags=parts[1].split("|").map(s=>s.trim()).filter(Boolean);meta.folders.push({id:uid(),name,tags,archived:isArch})}return}
    if(/^\d{8}$/.test(tr)){if(ce&&cd){days[cd].push(ce);ce=null}cd=tr;if(!days[cd])days[cd]=[]}
    else if(tr.startsWith("*")&&cd){if(ce)days[cd].push(ce);const content=tr.slice(1).trim();const si=content.indexOf("/");if(si===-1){ce=null;return}const time=content.slice(0,si).trim();let rest=content.slice(si+1).trim();
      // Parse multiple tags: [#tag1] [#tag2]
      let tags=[];const tagRe=/\[#(.+?)\]/g;let tm;while((tm=tagRe.exec(rest))!==null)tags.push(tm[1]);
      if(tags.length>0)rest=rest.replace(/\s*\[#.+?\]/g,"").trim();
      ce={id:uid(),time,text:rest,tags}}
    else if(ce&&line.startsWith("  ")){ce.text+="\n"+line.slice(2)}
  });if(ce&&cd)days[cd].push(ce);return{days,meta}}

async function handleImport(event){const files=event.target.files;if(!files||files.length===0)return;let count=0;const nt=new Set(allTags);const na=new Set(archivedTags);const nh=new Set(hiddenSuggestions);let importedFolders=[];
  for(const file of files){const text=await file.text();const result=parseTxtFile(text);const days=result.days;const meta=result.meta;
    for(const[dk,ents]of Object.entries(days)){const ex=storeGet("day:"+dk)||[];const merged=[...ex,...ents];merged.sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));storeSet("day:"+dk,merged);count+=ents.length;ents.forEach(e=>{getTags(e).forEach(t=>{if(t)nt.add(t)})})}
    if(meta.archived.length>0)meta.archived.forEach(t=>na.add(t));
    if(meta.hidden.length>0)meta.hidden.forEach(t=>nh.add(t));
    if(meta.folders.length>0)importedFolders=importedFolders.concat(meta.folders)}
  allTags=[...nt];saveTags();archivedTags=[...na];saveArchived();hiddenSuggestions=[...nh];saveHidden();
  if(importedFolders.length>0){const existingNames=new Set(folders.map(f=>f.name));importedFolders.forEach(f=>{if(!existingNames.has(f.name)){folders.push(f);existingNames.add(f.name)}});saveFolders()}
  renderDay();showToast("تم استيراد "+count+" ملاحظة");event.target.value=""}

document.addEventListener("DOMContentLoaded",()=>{
  loadTheme();loadTags();
  const input=document.getElementById("noteInput");
  input.addEventListener("input",updateSubmitBtn);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addEntry()}});
  setupTimeInputs();
  setupTagCombo("tagComboInput","tagDropdown",function(val,isNew){
    if(isNew&&!allTags.includes(val)){allTags.push(val);saveTags()}
    if(hiddenSuggestions.includes(val)){hiddenSuggestions=hiddenSuggestions.filter(t=>t!==val);saveHidden();showToast("تم إظهار الوسم في القائمة")}
    if(!selectedTags.includes(val)){selectedTags.push(val);renderSelectedTags()}
  },{allowCreate:true});
  renderDay();
  document.getElementById("appVersion").textContent="v"+APP_VERSION;
});

toggleTheme=function(){_origToggle();const isDark=document.documentElement.getAttribute("data-theme")==="dark";document.getElementById("metaThemeColor").content=isDark?"#1A1816":"#B8860B"};
const _origLoadTheme=loadTheme;
loadTheme=function(){_origLoadTheme();const isDark=document.documentElement.getAttribute("data-theme")==="dark";document.getElementById("metaThemeColor").content=isDark?"#1A1816":"#B8860B"};
